<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔒 IPTVPlayer LIVE APP - Проверка безопасности</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #000000 0%, #0a0a0f 50%, #000000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .verification-card {
      background: rgba(10, 15, 25, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.15), inset 0 0 60px rgba(0, 240, 255, 0.05);
      max-width: 520px;
      width: 100%;
      padding: 2.5rem 2rem;
    }
    .header { text-align: center; margin-bottom: 2rem; }
    .header-icon {
      background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(255,0,170,0.1));
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      border: 2px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }
    .header-icon i { font-size: 2.5rem; color: #00f0ff; filter: drop-shadow(0 0 10px rgba(0,240,255,0.5)); }
    h1 {
      font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, #00f0ff, #ff00aa);
      background-clip: text; -webkit-background-clip: text; color: transparent;
      letter-spacing: -0.5px; margin-bottom: 0.5rem;
    }
    .sub { color: #6b7280; font-size: 0.9rem; }
    .captcha-area {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .canvas-wrapper { text-align: center; margin-bottom: 1rem; }
    canvas {
      background: #f5f5f5;
      border-radius: 1rem;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      max-width: 100%; height: auto;
      cursor: pointer;
    }
    .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .refresh-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600; font-size: 0.85rem;
      color: #00f0ff;
      display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer; transition: all 0.3s;
    }
    .refresh-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .input-group { margin: 1.5rem 0 1rem; }
    label {
      font-weight: 600; font-size: 0.85rem;
      color: #00f0ff; letter-spacing: 0.5px;
      display: block; margin-bottom: 8px;
    }
    .captcha-input {
      width: 100%; padding: 14px 18px;
      background: rgba(0, 0, 0, 0.5);
      border: 1.5px solid rgba(0, 240, 255, 0.3);
      border-radius: 1rem;
      font-size: 1rem; color: #fff;
      font-weight: 500; outline: none;
      transition: all 0.3s;
    }
    .captcha-input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .verify-btn {
      background: linear-gradient(135deg, #00f0ff, #ff00aa);
      width: 100%; border: none;
      padding: 16px; border-radius: 1.5rem;
      font-weight: 700; font-size: 1.1rem;
      color: #000;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    }
    .verify-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.6);
    }
    .status {
      text-align: center; font-size: 0.85rem;
      margin-top: 1rem; padding: 12px;
      border-radius: 1rem;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.3);
    }
    .status.error { color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
    .status.success { color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .status.loading { color: #00f0ff; }
    footer { text-align: center; font-size: 0.75rem; margin-top: 1.5rem; color: #4b5563; }
    .warning-box {
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid rgba(255, 193, 7, 0.3);
      border-radius: 1rem;
      padding: 12px 16px;
      margin-top: 1.5rem;
      display: flex; align-items: center; gap: 10px;
      color: #ffc107; font-size: 0.8rem;
    }
  </style>
</head>
<body>
<div class="verification-card">
  <div class="header">
    <div class="header-icon">
      <i class="fas fa-shield-halved"></i>
    </div>
    <h1>IPTVPlayer LIVE APP</h1>
    <div class="sub">Проверка безопасности доступа</div>
  </div>

  <div class="captcha-area">
    <div class="canvas-wrapper">
      <canvas id="captchaCanvas" width="400" height="100"></canvas>
    </div>
    <div class="refresh-row">
      <span style="color:#6b7280;font-size:0.8rem;"><i class="fas fa-brain"></i> Введите символы с изображения</span>
      <button class="refresh-btn" id="refreshBtn"><i class="fas fa-rotate"></i> Обновить</button>
    </div>
  </div>

  <div class="input-group">
    <label><i class="fas fa-keyboard"></i> Код проверки</label>
    <input type="text" id="captchaInput" class="captcha-input" placeholder="Введите код..." autocomplete="off">
  </div>

  <button id="verifyBtn" class="verify-btn">
    <i class="fas fa-robot"></i> Я не робот
  </button>

  <div id="statusMsg" class="status">
    <i class="fas fa-lock"></i> Пройдите проверку для продолжения
  </div>

  <div class="warning-box">
    <i class="fas fa-triangle-exclamation"></i>
    <span>Мы заметили необычную активность. Пожалуйста, подтвердите что вы человек.</span>
  </div>

  <footer>
    После успешной проверки → переход в <strong style="color:#00f0ff">плеер</strong>
  </footer>
</div>

<script>
(function() {
  const canvas = document.getElementById('captchaCanvas');
  const ctx = canvas.getContext('2d');
  const captchaInput = document.getElementById('captchaInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const statusMsg = document.getElementById('statusMsg');
  
  let currentWord = '';
  let isLoading = false;
  let verified = false;

  const WORDS = [
    'stream', 'player', 'iptv', 'live', 'video', 'watch', 'media',
    'cyber', 'neon', 'quantum', 'digital', 'future', 'prime', 'elite'
  ];

  function getRandomWord() {
    return WORDS[Math.floor(Math.random() * WORDS.length)];
  }

  function drawCaptcha(word) {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    
    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#e8f4f8');
    grad.addColorStop(1, '#f0e8f8');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    // Noise lines
    for (let i = 0; i < 15; i++) {
      ctx.beginPath();
      ctx.moveTo(Math.random() * w, Math.random() * h);
      ctx.lineTo(Math.random() * w, Math.random() * h);
      ctx.strokeStyle = `rgba(${Math.random()*200},${Math.random()*200},${Math.random()*200},0.3)`;
      ctx.lineWidth = 1 + Math.random() * 2;
      ctx.stroke();
    }
    
    // Draw text with distortion
    ctx.save();
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.textBaseline = 'middle';
    
    const centerX = w / 2;
    const centerY = h / 2;
    const angle = (Math.random() - 0.5) * 0.3;
    
    ctx.translate(centerX, centerY);
    ctx.rotate(angle);
    
    // Gradient text
    const textGrad = ctx.createLinearGradient(-word.length * 10, 0, word.length * 10, 0);
    textGrad.addColorStop(0, '#0066cc');
    textGrad.addColorStop(0.5, '#cc0066');
    textGrad.addColorStop(1, '#0066cc');
    ctx.fillStyle = textGrad;
    
    ctx.fillText(word, -word.length * 12, 0);
    ctx.restore();
    
    // Add noise dots
    for (let i = 0; i < 100; i++) {
      ctx.fillStyle = `rgba(${Math.random()*255},${Math.random()*255},${Math.random()*255},0.5)`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
  }

  async function updateCaptcha() {
    if (isLoading) return;
    isLoading = true;
    statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Генерация капчи...';
    statusMsg.className = 'status loading';
    
    currentWord = getRandomWord();
    drawCaptcha(currentWord);
    
    setTimeout(() => {
      statusMsg.innerHTML = '<i class="fas fa-lock"></i> Введите код с изображения';
      statusMsg.className = 'status';
      captchaInput.value = '';
      captchaInput.focus();
      isLoading = false;
    }, 500);
  }

  async function verify() {
    if (verified) return;
    
    const input = captchaInput.value.trim().toLowerCase();
    if (!input) {
      statusMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Введите код!';
      statusMsg.className = 'status error';
      return;
    }
    
    if (input === currentWord) {
      verified = true;
      statusMsg.innerHTML = '<i class="fas fa-check-circle"></i> Успех! Перенаправление...';
      statusMsg.className = 'status success';
      verifyBtn.disabled = true;
      verifyBtn.style.opacity = '0.5';
      
      setTimeout(() => {
        window.location.href = '/live/player.html';
      }, 1000);
    } else {
      statusMsg.innerHTML = '<i class="fas fa-times-circle"></i> Неверно! Попробуйте снова';
      statusMsg.className = 'status error';
      captchaInput.value = '';
      await updateCaptcha();
    }
  }

  verifyBtn.addEventListener('click', verify);
  refreshBtn.addEventListener('click', (e) => { e.preventDefault(); updateCaptcha(); });
  captchaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verify(); });
  
  // Initialize
  updateCaptcha();
})();
</script>
</body>
</html>
