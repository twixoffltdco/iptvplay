<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка безопасности</title>
  <style>
    body {
      font-family: 'YS Text', 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    .icon-box {
      width: 60px;
      height: 60px;
      background: #fc0; /* Yandex Yellow */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 30px;
      color: #000;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .captcha-block {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .checkbox-fake {
      width: 24px;
      height: 24px;
      border: 2px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }
    .checkbox-fake:hover {
      border-color: #fc0;
    }
    .checkbox-fake.checked {
      background: #fc0;
      border-color: #fc0;
    }
    .checkbox-fake.checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }
    .logo-text {
      font-size: 14px;
      color: #999;
      text-align: left;
      margin-left: 10px;
    }
    .logo-text span {
      display: block;
      color: #333;
      font-weight: 500;
      font-size: 16px;
    }
    .timer-bar {
      height: 4px;
      background: #eee;
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }
    .timer-progress {
      height: 100%;
      background: #fc0;
      width: 0%;
      transition: width 1s linear;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 13px;
      color: #888;
    }
    /* Скрытая форма для реальной капчи если нужно усложнить */
    #real-captcha-area {
      display: none;
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    button.verify-btn {
      background: #fc0;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    button.verify-btn:hover {
      background: #fdd000;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="icon-box">🛡️</div>
  <h1>Проверка безопасности</h1>
  <p>Мы заметили необычно много запросов с вашего IP-адреса. Пожалуйста, подтвердите, что вы человек, чтобы продолжить доступ к IPTVPlayer LIVE APP.</p>

  <div class="captcha-block">
    <div class="checkbox-fake" id="captchaCheck" onclick="startVerification()"></div>
    <div class="logo-text">
      Я не робот
      <span>IPTV Security</span>
    </div>
  </div>

  <!-- Дополнительная проверка если скрипт решит усложнить -->
  <div id="real-captcha-area">
    <p style="font-size:13px; margin-bottom:5px;">Введите код с картинки:</p>
    <canvas id="simpleCanvas" width="200" height="60" style="background:#fff; border:1px solid #ddd; border-radius:4px; margin-bottom:10px;"></canvas>
    <input type="text" id="codeInput" placeholder="Код">
    <button class="verify-btn" onclick="checkCode()">Проверить</button>
  </div>

  <div class="timer-bar">
    <div class="timer-progress" id="progressBar"></div>
  </div>
  <div class="status-msg" id="statusText">Ожидание подтверждения...</div>
</div>

<script>
  let verified = false;
  const redirectUrl = '/live/'; // Путь к основному приложению
  const autoRedirectTime = 19; // Секунд

  function startVerification() {
    if (verified) return;
    const check = document.getElementById('captchaCheck');
    const status = document.getElementById('statusText');
    const bar = document.getElementById('progressBar');
    
    check.classList.add('checked');
    status.innerText = "Проверка...";
    
    // Имитация задержки проверки
    setTimeout(() => {
      // 80% шанс что пропустит сразу, 20% что попросит код (для реалистичности)
      if (Math.random() > 0.2) {
        success();
      } else {
        showHardCaptcha();
      }
    }, 1500);
  }

  function showHardCaptcha() {
    document.getElementById('real-captcha-area').style.display = 'block';
    document.getElementById('statusText').innerText = "Требуется дополнительная проверка";
    drawSimpleCaptcha();
  }

  function success() {
    verified = true;
    const status = document.getElementById('statusText');
    const bar = document.getElementById('progressBar');
    
    status.innerText = "Подтверждено! Перенаправление...";
    status.style.color = "green";
    
    // Анимация прогресс бара
    let width = 0;
    const interval = setInterval(() => {
      if (width >= 100) {
        clearInterval(interval);
        window.location.href = redirectUrl;
      } else {
        width += 100 / (autoRedirectTime * 10); // обновление каждые 100мс
        bar.style.width = width + '%';
      }
    }, 100);
    
    // Фолбэк редирект
    setTimeout(() => {
      window.location.href = redirectUrl;
    }, autoRedirectTime * 1000);
  }

  // Простая канвас капча для второго уровня
  let currentCode = '';
  function drawSimpleCaptcha() {
    const canvas = document.getElementById('simpleCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,200,60);
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(0,0,200,60);
    
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i=0; i<5; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    currentCode = code;
    
    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = '#333';
    ctx.textBaseline = 'middle';
    
    // Рисуем буквы со смещением
    for(let i=0; i<code.length; i++) {
      ctx.save();
      ctx.translate(30 + i*30, 30);
      ctx.rotate((Math.random() - 0.5) * 0.4);
      ctx.fillText(code[i], 0, 0);
      ctx.restore();
    }
    
    // Шум
    for(let i=0; i<50; i++) {
      ctx.beginPath();
      ctx.moveTo(Math.random()*200, Math.random()*60);
      ctx.lineTo(Math.random()*200, Math.random()*60);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.stroke();
    }
  }

  function checkCode() {
    const input = document.getElementById('codeInput').value.toUpperCase();
    if (input === currentCode) {
      success();
    } else {
      alert('Неверный код. Попробуйте снова.');
      drawSimpleCaptcha();
      document.getElementById('codeInput').value = '';
    }
  }

  // Автозапуск таймера для тех кто не кликает (опционально, сейчас только по клику)
  // Но добавим фоновую проверку
  console.log("Security Check Initialized");
</script>

</body>
</html>
